<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pick a random prompt." />
    <title>Prompt Picker</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main>
      <section class="picker" aria-label="Random prompt picker">
        <div id="prompt" class="prompt" aria-live="polite" aria-atomic="true"></div>
        <button id="prompt-button" type="button" disabled>Give me a prompt</button>
      </section>
    </main>
  </body>
</html>
